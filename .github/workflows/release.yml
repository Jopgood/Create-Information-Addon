name: Release

# 1.20.1 Forge release. Fires on a tag like:  v1.9.0+mc1.20.1
# (The main/1.21.1 branch uses plain v* tags; this branch's +mc1.20.1 suffix keeps the two streams
# distinct and is what disambiguates the published artifact.)
on:
  push:
    tags:
      - 'v*+mc1.20.1'

permissions:
  contents: write  # needed for mc-publish to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tag is vX.Y.Z+mc1.20.1. Strip the leading v and the +mc1.20.1 suffix to get the mod version,
      # and verify it matches gradle.properties.
      - name: Resolve and verify version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.9.0+mc1.20.1
          FULL="${TAG#v}"                   # 1.9.0+mc1.20.1  (published version number)
          VERSION="${FULL%+mc1.20.1}"       # 1.9.0          (matches mod_version / release notes)
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')

          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' (version $VERSION) does not match mod_version=$MOD_VERSION in gradle.properties."
            exit 1
          fi

          NOTES="docs/releases/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes '$NOTES'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build

      # Give the artifact an unambiguous, MC-tagged filename for the GitHub Release asset.
      - name: Stage versioned artifact
        run: cp "build/libs/cfwinfo-${{ steps.version.outputs.version }}.jar" "build/libs/cfwinfo-${{ steps.version.outputs.full }}.jar"

      - name: Publish to GitHub, CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: "v${{ steps.version.outputs.version }} (1.20.1 Forge)"
          version: ${{ steps.version.outputs.full }}
          version-type: release
          changelog-file: ${{ steps.version.outputs.notes }}

          files: build/libs/cfwinfo-${{ steps.version.outputs.full }}.jar

          # ---- CurseForge (project 1023209) ----
          curseforge-id: 1023209
          curseforge-token: ${{ secrets.CF_API_TOKEN }}

          # ---- Modrinth (same project; auto-skips if creds missing) ----
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ---- 1.20.1 Forge metadata ----
          loaders: forge
          game-versions: '1.20.1'
          java: '17'
          dependencies: |
            create(required)
            create-stuff-additions(optional)
