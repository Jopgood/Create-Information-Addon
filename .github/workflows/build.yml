name: CI

# 1.20.1 Forge branch. Runs on PRs and on pushes to mc/1.20.1.
on:
  push:
    branches: ['mc/1.20.1']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

  # Gate that every version bump ships with release notes (shared with main: same mod_version,
  # same CHANGELOG.md / docs/releases entries).
  release-readiness:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/mc/1.20.1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify release notes exist for current mod_version
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "mod_version = $VERSION"

          NOTES="docs/releases/v${VERSION}.md"
          FAIL=0

          if [ ! -f "$NOTES" ]; then
            echo "::error file=gradle.properties::Missing release notes file '$NOTES' for version $VERSION."
            FAIL=1
          fi

          if ! grep -q "\[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '[$VERSION]' section found in CHANGELOG.md."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "Add the release notes before merging a version bump. See RELEASING.md."
            exit 1
          fi

          echo "Release notes present for $VERSION."
