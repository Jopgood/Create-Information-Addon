modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Jopgood/Create-Information-Addon/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create is required (the mod renders Create tank contents).
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Create: Stuff 'N Additions provides the tank items we read; optional (overlay just stays hidden without it).
[[dependencies.${mod_id}]]
    modId="create_sa"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
