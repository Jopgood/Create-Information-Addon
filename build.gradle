// ============================================================================
// 1.20.1 Forge backport (mc/1.20.1) — ModDevGradle (legacy Forge) + Silk.
//
// This mirrors Create's own mc1.20.1 build toolchain (net.neoforged.moddev.legacyforge
// + dev.ithundxr.silk), which is the same MDG family as the 1.21.1 main branch. Silk
// provides the mod* configurations (modImplementation/modCompileOnly/modRuntimeOnly) that
// deobfuscate mod dependencies AND remap their mixin refmaps correctly — which raw
// ForgeGradle fg.deobf did not do for the Create 6.x stack (catnip-in-Ponder mixins).
// ============================================================================

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id 'dev.ithundxr.silk' version '0.11.15'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 for 1.20.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.createmod.net' }          // Create, Ponder (bundles catnip), Flywheel
    maven { url = 'https://maven.tterrag.com' }            // Registrate (1.20.1)
    maven { url = 'https://maven.blamejared.com' }         // JEI
    maven { url = 'https://api.modrinth.com/maven' }       // Create: Stuff 'N Additions
    maven { url = 'https://modmaven.dev' }                 // fallback
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // mod* configurations (from Silk) deobfuscate these mod jars and remap their mixin refmaps to
    // the dev mappings. catnip is NOT declared — it is bundled inside Ponder on 1.20.1.
    modImplementation "com.simibubi.create:create-1.20.1:${create_version}:all"
    modImplementation "net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-1.20.1:${flywheel_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}"
    modImplementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // JEI (optional integration): API at compile, full jar at runtime.
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${jei_version}"

    // Create: Stuff 'N Additions (the items we read), pulled via the Modrinth maven.
    modImplementation "maven.modrinth:create-stuff-additions:${csa_modrinth_version}"
}

// Expand ${...} tokens in the Forge mod metadata.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
