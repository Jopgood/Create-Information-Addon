# ============================================================================
# 1.20.1 Forge backport branch (mc/1.20.1) — WORK IN PROGRESS scaffold.
# Targets Minecraft 1.20.1 / Forge / Java 17, against Create 6.x (Forge) + catnip.
# See docs/ports/1.20.1-port-scope.md. Versions marked TODO must be resolved on the
# first local `./gradlew build` (they are locked to Create 6.0.8 and were not
# resolvable by remote maven probing).
# ============================================================================

org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is left OFF for now — ForgeGradle is not fully config-cache safe.
org.gradle.configuration-cache=false

# Mappings (Parchment for 1.20.1). Verify/update the mappings date against parchmentmc.org.
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# Forge (https://files.minecraftforge.net) — latest 1.20.1 line.
forge_version=47.4.20

## Mod Properties (kept in lockstep with main / 1.21.1 feature set)
mod_id=cfwinfo
mod_name=Create: Fuel & Water Information
mod_license=MIT
mod_version=1.9.0
mod_group_id=com.jopgood.cfwinfo
mod_authors=Jopgood
mod_description=This mod will render Tank fuel and water levels on the HUD so you do not have to keep checking!

# Create 6.x stack for 1.20.1 (Forge), from maven.createmod.net
# Versions taken from Create's own mc1.20.1 gradle.properties (authoritative for the 6.x stack).
create_version = 6.0.8-291
catnip_version = 0.8.44
ponder_version = 1.0.91
# Flywheel: group is dev.engine-room.flywheel (hyphen), artifact flywheel-forge-1.20.1, createmod.net.
flywheel_version = 1.0.6-beta-266
# Registrate for 1.20.1 lives on maven.tterrag.com (NOT ithundxr, which is the 1.21.1 home).
registrate_version = MC1.20-1.3.3

# JEI for 1.20.1 (Forge), from maven.blamejared.com
jei_version = 15.20.0.130

# Create: Stuff 'N Additions — pulled via the Modrinth maven (api.modrinth.com/maven).
# 'uzmWSzyy' is the version id of the 1.20.1 Forge build (v2.1.2).
csa_modrinth_version = uzmWSzyy
